[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synesis-graph"
version = "0.11.0"
description = "Universal pipeline from Synesis projects to graph databases and HTML visualizations"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only AND LicenseRef-Synesis-data-output-exception"
license-files = ["LICENSE", "LICENSE.exception"]
authors = [
    {name = "De Britto, Christian Maciel", email = "chriseana@gmail.com"}
]
keywords = [
    "synesis",
    "neo4j",
    "knowledge-graph",
    "qualitative-research",
    "graph-database",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
    "Operating System :: OS Independent",
]
dependencies = [
    "synesis>=0.10.0",
    "click>=8.0",
    # Motor de grafo local, sem servidor e sem Java de sistema (traz a propria
    # JVM). Dependencia BASE, nao extra: o publico deste modulo e o pesquisador
    # qualitativo, e "instale o extra correto" e uma etapa a mais para errar
    # antes de ver qualquer resultado. ~67 MB de download e um preco menor do
    # que essa friccao. Quem so usa Neo4j ou HTML carrega o peso sem usa-lo —
    # troca deliberada, decidida a favor de quem tem menos ferramentas.
    #
    # O MARCADOR NAO E OPCIONAL. O projeto publica wheels para Linux
    # (x86_64/ARM64), Windows (x86_64) e macOS **Apple Silicon apenas**, e NAO
    # publica sdist. Num Mac Intel pip nao acha nada para instalar e aborta a
    # instalacao INTEIRA — o pesquisador fica sem Neo4j e sem HTML tambem, por
    # causa de um motor que ele talvez nunca fosse usar. O marcador faz o pip
    # simplesmente pular a dependencia onde nao ha wheel; o backend embedded
    # entao reporta `DependencyError` se for chamado, que e um problema
    # localizado em vez de um bloqueio total.
    "arcadedb-embedded>=26.8.1; platform_system != 'Darwin' or platform_machine == 'arm64'",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
# Geracao local de embeddings para busca semantica. Extra opcional porque
# sentence-transformers traz torch (~2 GB) — desproporcional para quem usa o
# modulo so para sincronizar o grafo. O codigo importa preguicosamente e
# reporta DependencyError quando ausente, nunca ImportError.
embeddings = ["sentence-transformers>=3.0"]
# Mantido como extra vazio-equivalente: `pip install synesis-graph[arcadedb-embedded]`
# continua funcionando para quem seguiu instrucoes antigas, mas o pacote ja vem na
# instalacao base desde 0.10.0 e nao ha nada a acrescentar.
arcadedb-embedded = [
    "arcadedb-embedded>=26.8.1; platform_system != 'Darwin' or platform_machine == 'arm64'"
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=0.10",
    # tests/test_packaging.py le o CITATION.cff para conferir se a versao nao
    # divergiu do pyproject — ja aconteceu duas vezes no ecossistema.
    "pyyaml>=6.0",
    # tomllib e stdlib em >=3.11; no piso 3.10 (coberto pela matriz do CI) o
    # mesmo teste precisa de tomli para ler o pyproject.
    "tomli>=2.0 ; python_version < '3.11'",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "synesis>=0.10.0",
]

[project.urls]
Repository = "https://github.com/synesis-lang/synesis-graph"
Changelog = "https://github.com/synesis-lang/synesis-graph/blob/main/CHANGELOG.md"

[project.scripts]
synesis-graph = "synesis_graph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synesis_graph*"]

[tool.setuptools]
py-modules = ["synesis2graph"]

[tool.setuptools.package-data]
synesis_graph = ["../templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["F541"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
