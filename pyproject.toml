[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synesis-graph"
version = "0.5.0"
description = "Universal pipeline from Synesis projects to graph databases and HTML visualizations"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only AND LicenseRef-Synesis-data-output-exception"
license-files = ["LICENSE", "LICENSE.exception"]
authors = [
    {name = "De Britto, Christian Maciel", email = "chriseana@gmail.com"}
]
keywords = [
    "synesis",
    "neo4j",
    "knowledge-graph",
    "qualitative-research",
    "graph-database",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
    "Operating System :: OS Independent",
]
dependencies = [
    "synesis>=0.10.0",
    "click>=8.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=0.10",
    # tests/test_packaging.py le o CITATION.cff para conferir se a versao nao
    # divergiu do pyproject — ja aconteceu duas vezes no ecossistema.
    "pyyaml>=6.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "synesis>=0.10.0",
]

[project.urls]
Repository = "https://github.com/synesis-lang/synesis-graph"
Changelog = "https://github.com/synesis-lang/synesis-graph/blob/main/CHANGELOG.md"

[project.scripts]
synesis-graph = "synesis_graph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synesis_graph*"]

[tool.setuptools]
py-modules = ["synesis2graph"]

[tool.setuptools.package-data]
synesis_graph = ["../templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["F541"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
